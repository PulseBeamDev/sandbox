    .region-sub{font:400 13px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#91a5b9}
    .provider{font:650 16px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f4f8fb}
    .qualifier{font:400 12px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#91a5b9}
    .metric{font:650 15px "SFMono-Regular",Consolas,monospace;fill:#e8eff5}
    .detail{font:400 12px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#91a5b9}
    .axis{font:500 11px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#71869a}
    .summary-name{font:650 17px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f4f8fb}
