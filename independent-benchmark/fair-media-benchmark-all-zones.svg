<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1440" viewBox="0 0 1800 1440" role="img" aria-labelledby="title desc">
<title id="title">Fair global media benchmark: MoQ, PulseBeam, and Cloudflare</title>
<desc id="desc">Capture-to-decoded H.264 latency, loss, freezes, and join time from California to Virginia, Frankfurt, and Tokyo. MoQ has the lowest median and 99th-percentile latency in every region and receives all measured frames.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111d"/><stop offset="1" stop-color="#0b1928"/></linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020812" flood-opacity=".34"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#627d96"/></marker>
  <style>
    .title{font:700 44px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f4f8fb;letter-spacing:-.8px}
    .subtitle{font:400 18px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#91a5b9}
    .eyebrow{font:650 13px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#91a5b9;letter-spacing:1.2px}
    .topology{font:650 17px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f4f8fb}
