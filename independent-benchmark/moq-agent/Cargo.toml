[package]
name = "moq-benchmark-agent"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
draft14 = []

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
moq-native-ietf = "=0.9.2"
moq-transport = "=0.15.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
